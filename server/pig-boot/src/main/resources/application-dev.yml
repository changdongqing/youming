spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}   # 本机 docker redis (1Panel-redis)，原为容器主机名 pig-redis
      database: 5
      password: ${REDIS_PASSWORD:redis_6QX4h2}
  # Quartz 属性 (迁移到 PG 后显式声明, 确保 PostgreSQLDelegate 生效, 与 quartz-config.yml 互为兜底)
  quartz:
    properties:
      org:
        quartz:
          jobStore:
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
  # Flyway 数据库版本管理 (youming 迁移 PG 后引入, 基线脚本 V1/V2/V3 见 pig-common-data/db/migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true      # 存量库迁移时建立基线 (空库则直接 migrate)
    baseline-version: 0            # 基线版本 (V1 之前)
    validate-on-migrate: true      # 迁移前校验已应用脚本 checksum
    table: flyway_schema_history   # 历史表名
    encoding: UTF-8
    placeholder-replacement: false # 禁用 placeholder 替换 (gen_template 种子数据含 ${package} 等 Velocity 变量, 非 Flyway 占位符)
  # 数据库相关配置 (PostgreSQL, 由 MySQL 迁移而来)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: org.postgresql.Driver
      username: ${PG_USER:user_PAmcy2}
      password: ${PG_PASSWORD:password_bkQ4JT}
      url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DB:youmingdb}

# 文件上传配置
file:
  type: local
  local:
    # 本地存储根目录 (原为上游 macOS 路径 /Users/lengleng/Downloads/img, 本机不存在导致上传报错"没有那个文件或目录")
    base-path: ${FILE_BASE_PATH:/home/chdq/youming/upload}

# 验证码配置
aj:
  captcha:
    water-mark: pig4cloud

# 登录报文加密根密钥 ，必须是16位
security:
  encodeKey: thanks,pig4cloud

# 配置文件加密根密码
jasypt:
  encryptor:
    password: pig

# swagger token url 配置
swagger:
  token-url: ${swagger.gateway}/admin/oauth2/token
