spring:
  data:
    redis:
      # 对齐本机 docker 容器 devops-redis (redis:latest, 端口 6379)
      # 启动命令: redis-server --requirepass redis --appendonly yes
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: 0          # devops-redis 未指定 db, 使用默认 0
      password: ${REDIS_PASSWORD:redis}
  # Quartz 属性 (迁移到 PG 后显式声明, 确保 PostgreSQLDelegate 生效, 与 quartz-config.yml 互为兜底)
  quartz:
    job-store-type: jdbc # 持久化到数据库
    jdbc:
      initialize-schema: never # QRTZ_ 表已由 Flyway V3 创建, 不再由 Quartz 自动建表
    properties:
      org:
        quartz:
          jobStore:
            class: org.springframework.scheduling.quartz.LocalDataSourceJobStore # 数据库存储
            driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
  # Flyway 数据库版本管理 (youming 迁移 PG 后引入, 基线脚本 V1/V2/V3 见 pig-common-data/db/migration)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true      # 存量库迁移时建立基线 (空库则直接 migrate)
    baseline-version: 0            # 基线版本 (V1 之前)
    validate-on-migrate: true      # 迁移前校验已应用脚本 checksum
    table: flyway_schema_history   # 历史表名
    encoding: UTF-8
    placeholder-replacement: false # 禁用 placeholder 替换 (gen_template 种子数据含 ${package} 等 Velocity 变量, 非 Flyway 占位符)
  # 数据库相关配置 (PostgreSQL, 由 MySQL 迁移而来)
  # 对齐本机 docker 容器 devops-postgres (postgres:latest PG 18.4, 端口 5432)
  # 容器凭证: POSTGRES_USER=postgres / POSTGRES_PASSWORD=postgres
  # 业务库 mingwanwudb 已在 devops-postgres 中创建 (owner=postgres)
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      driver-class-name: org.postgresql.Driver
      username: ${PG_USER:postgres}
      password: ${PG_PASSWORD:postgres}
      url: jdbc:postgresql://${PG_HOST:127.0.0.1}:${PG_PORT:5432}/${PG_DB:mingwanwudb}

# 文件上传配置
file:
  type: local
  local:
    base-path: /Users/lengleng/Downloads/img

# 验证码配置
aj:
  captcha:
    water-mark: pig4cloud

# 登录报文加密根密钥 ，必须是16位
security:
  encodeKey: thanks,pig4cloud

# 配置文件加密根密码
jasypt:
  encryptor:
    password: pig

# swagger token url 配置
swagger:
  token-url: ${swagger.gateway}/admin/oauth2/token
