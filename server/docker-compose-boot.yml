# 使用说明 V6.0 - 单体架构版本 (PostgreSQL)
# 1. 先构建单体 JAR: mvn clean install -Pboot -DskipTests
# 2. 启动服务: docker compose -f docker-compose-boot.yml up -d
# 3. 静静等待服务启动
# 注: 本机已通过 1Panel 运行 PostgreSQL (1Panel-postgresql-ANBv, 库 mingwanwudb),
#     本地调试可直接连该容器, 无需启动此 pig-postgres 服务。
#     仅在需要纯净容器化环境时取消下方 pig-postgres 注释。
services:
  # pig-postgres:
  #   build:
  #     context: ./db
  #     dockerfile: postgresql/Dockerfile
  #   environment:
  #     POSTGRES_USER: user_PAmcy2
  #     POSTGRES_PASSWORD: password_bkQ4JT
  #     POSTGRES_DB: mingwanwudb
  #   restart: always
  #   container_name: pig-postgres
  #   image: pig-postgres
  #   ports:
  #     - 5432:5432
  #   networks:
  #     - spring_cloud_default

  pig-redis:
    container_name: pig-redis
    image: registry.cn-hangzhou.aliyuncs.com/dockerhub_mirror/redis
    restart: always
    networks:
      - spring_cloud_default

  pig-redis:
    container_name: pig-redis
    image: registry.cn-hangzhou.aliyuncs.com/dockerhub_mirror/redis
    restart: always
    networks:
      - spring_cloud_default

  # 单体的时候注意，服务名称命名为 pig-gateway 对应前端nginx 配置
  pig-gateway:
    build:
      context: ./pig-boot
    restart: always
    container_name: pig-boot
    image: pig-boot
    ports:
      - 9999:9999
    networks:
      - spring_cloud_default

networks:
  spring_cloud_default:
    name: spring_cloud_default
    driver: bridge
